<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organic Cafe</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <!-- ロゴ -->
    <a href="index.html" id="logo">
      <img src="images/logo.png" alt="Organic Cafe">
    </a>

    <!-- PCナビ -->
    <nav id="nav-pc">
      <a href="#concept">CONCEPT</a>
      <a href="#product">PRODUCT</a>
      <a href="#contact">CONTACT</a>
    </nav>

    <!-- スマホ用メニューボタン -->
    <img
      id="menu-sp"
      src="images/button-menu.png"
      alt="メニュー"
      onclick="document.getElementById('nav-sp').style.display='block'">

    <!-- スマホ用ナビ -->
    <nav id="nav-sp">

      <img
        id="close"
        src="images/button-close.png"
        alt="閉じる"
        onclick="document.getElementById('nav-sp').style.display='none'">

      <a id="logo-sp" href="index.html">
        <img src="images/logo-sp.png" alt="Organic Cafe">
      </a>

      <a class="menu" href="#concept">CONCEPT</a>
      <a class="menu" href="#product">PRODUCT</a>
      <a class="menu" href="#contact">CONTACT</a>

    </nav>
  </header>

  <main>

    <section id="main-visual">
      <div id="main-message">
        <h1>Organic Cafe</h1>
        <p>自家焙煎コーヒーが買えるお店</p>
      </div>

      <img src="images/main-image.jpg"
           alt="コーヒーをハンドドリップで淹れる画像">
    </section>

  </main>

</body>
</html>
